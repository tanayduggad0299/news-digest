# Clustering regression. Runs on every change to the pipeline, NOT daily:
# the answer key is frozen, so the result only moves when the code does.
# Running it on a schedule would burn minutes to re-confirm yesterday's number.
name: eval

on:
  push:
    paths:
      - "digest/**"
      - "evals/**"
      - ".github/workflows/eval.yml"
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('digest/config.py') }}

      # No API key needed: the gold set carries its own article text and the
      # embedder runs locally. The test is free and fully deterministic.
      - name: Clustering regression
        run: python evals/run_regression.py --sweep
