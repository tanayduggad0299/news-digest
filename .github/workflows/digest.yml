# The morning digest: 07:00 IST every day.
name: digest

on:
  schedule:
    # GitHub Actions cron is UTC. 07:00 IST = 01:30 UTC.
    # Note: scheduled runs can be delayed by several minutes under platform
    # load, so treat this as "shortly after 7", not "at 7:00:00".
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: digest-db
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      # Top up with anything published since the last collection run, so the
      # digest sees the most recent few hours too.
      # Cache the embedding model so it is not re-downloaded daily.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('digest/config.py') }}

      - name: Final collection sweep
        run: |
          python -m digest.collect
          python -m digest.extract

      - name: Build and send the digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO:      ${{ secrets.DIGEST_TO }}
        run: python run_pipeline.py --skip-collect --send

      # Keep the run's output even when the job fails, so a morning with no
      # email leaves evidence rather than silence.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            data/digest_latest.json
            data/digest_preview.html
          retention-days: 14

      - name: Persist the database
        if: always()
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -f data/digest.db
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push
