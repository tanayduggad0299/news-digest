# One-off diagnostic: which news sources are reachable FROM a GitHub runner.
# Manual dispatch only — this is not part of the daily pipeline.
name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-collect.txt
      - run: python probe_sources.py
