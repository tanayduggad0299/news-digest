# The morning digest: 07:00 IST every day.
name: digest

on:
  schedule:
    # GitHub Actions cron is UTC. 07:00 IST = 01:30 UTC.
    #
    # We fire at 23:47 UTC (05:17 IST) instead, deliberately early. Measured
    # reality: a 01:30 schedule fired at 06:19 UTC, nearly five hours late.
    # GitHub runs scheduled jobs on spare shared capacity and gives them no
    # timing guarantee, with round-number minutes the most congested. Firing
    # ~100 minutes early and on an odd minute absorbs a typical delay so the
    # digest lands near 07:00 IST rather than mid-morning.
    #
    # If it must arrive at an exact time, GitHub Actions is the wrong scheduler
    # and an always-on host with real cron is the answer.
    - cron: "47 23 * * *"
  workflow_dispatch:

concurrency:
  group: digest-db
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The accumulated article database lives in the Actions cache, NOT in git.
      # Committing it back to the repo worked, but every run raced developer
      # pushes to main and the binary file conflicted constantly. The cache is
      # write-once per key, so each run restores the newest snapshot and saves a
      # fresh one under its own run id.
      - name: Restore article database
        uses: actions/cache/restore@v4
        with:
          path: data/digest.db
          key: digestdb-${{ github.run_id }}
          restore-keys: digestdb-

      - run: |
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      # Top up with anything published since the last collection run, so the
      # digest sees the most recent few hours too.
      # Cache the embedding model so it is not re-downloaded daily.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('digest/config.py') }}

      - name: Final collection sweep
        run: |
          python -m digest.collect
          python -m digest.extract

      - name: Build and send the digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO:      ${{ secrets.DIGEST_TO }}
        run: python run_pipeline.py --skip-collect --send

      # Keep the run's output even when the job fails, so a morning with no
      # email leaves evidence rather than silence.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            data/digest_latest.json
            data/digest_preview.html
          retention-days: 14

      - name: Save article database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/digest.db
          key: digestdb-${{ github.run_id }}
